# Database configuration
db.default.driver = "org.postgresql.Driver"
db.default.url = "jdbc:postgresql://localhost:5432/bootie"
db.default.url = ${?DATABASE_URL}
db.default.user = "bootie"
db.default.user = ${?DATABASE_USER}
db.default.password = "bootie"
db.default.password = ${?DATABASE_PASSWORD}

# Connection pool settings
db.default.poolInitialSize = 5
db.default.poolMaxSize = 20
db.default.poolConnectionTimeoutMillis = 1000

# Misskey configuration
misskey.instance-url = "https://misskey.example.com"
misskey.instance-url = ${?MISSKEY_INSTANCE_URL}
misskey.token = "your-misskey-token-here"
misskey.token = ${?MISSKEY_TOKEN}
misskey.visibility = "home"

# Posting configuration
posting.interval-seconds = 30
posting.interval-seconds = ${?POSTING_INTERVAL_SECONDS}
posting.parallelism = 1
posting.parallelism = ${?POSTING_PARALLELISM}

# Scraping configuration
scraping.interval-seconds = 10
scraping.user-agent = "Bootie/0.1.0 (+https://github.com/KisaragiEffective/Bootie)"
scraping.booth-url = "https://booth.pm/ja/items"
scraping.target-tag = "VRChat"
